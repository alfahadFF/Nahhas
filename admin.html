<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة العروض - النحاس</title>
  <style>
    :root {
      --primary: #c9933f;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f0f0f0;
      --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    h2 { color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #bbb; }
    input[type="text"], textarea, select {
      width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;
    }
    input[type="file"] { display: none; }
    .upload-btn {
      display: block; width: 100%; padding: 12px; background: #2a2a2a; border: 1px dashed var(--primary);
      color: var(--primary); text-align: center; border-radius: 8px; cursor: pointer; font-weight: 500;
    }
    .preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--primary); color: #000; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-msg { text-align: center; margin-top: 12px; font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <h2>إدارة عروض السلايدر</h2>

  <div class="card">
    <form id="offerForm">
      <div class="form-group">
        <label>عنوان العرض الرئيسي</label>
        <input type="text" id="title" placeholder="مثال: خصم 20% على القهوة والمكسرات" required>
      </div>

      <div class="form-group">
        <label>وصف العرض</label>
        <textarea id="description" rows="2" placeholder="تفاصيل العرض..."></textarea>
      </div>

      <div class="form-group">
        <label>صورة العرض (السلايدر)</label>
        <label for="imageInput" class="upload-btn">📷 اضغط لاختيار صورة من الاستوديو</label>
        <input type="file" id="imageInput" accept="image/*">
        <img id="imagePreview" class="preview-img" alt="معاينة الصورة">
      </div>

      <div class="form-group">
        <label>حالة العرض</label>
        <select id="available">
          <option value="متوفر">متوفر (يظهر بالسلايدر)</option>
          <option value="غير متوفر">غير متوفر (مخفي)</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">حفظ ونشر العرض</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEWgcYs1dV3hKP9Qivx3gOOJlCgUBEKibqeNUfQ7c-z0XOwxrgwfqhOt_isoe4K_Wv/exec";
  const CLOUD_NAME = "dvzg70krq";
  const UPLOAD_PRESET = "alnahhas";

  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');
  const form = document.getElementById('offerForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      imagePreview.src = URL.createObjectURL(file);
      imagePreview.style.display = 'block';
    }
  });

  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    
    if (!res.ok) throw new Error('فشل رفع الصورة إلى Cloudinary');
    const data = await res.json();
    return data.secure_url;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusDiv.style.color = '#c9933f';
    statusDiv.textContent = 'جاري رفع الصورة والبيانات... ⏳';

    try {
      let imageUrl = '';
      const file = imageInput.files[0];

      if (file) {
        imageUrl = await uploadToCloudinary(file);
      }

      const payload = {
        action: 'addOffer',
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        img: imageUrl,
        available: document.getElementById('available').value
      };

      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        statusDiv.style.color = '#4CAF50';
        statusDiv.textContent = '✅ تم نشر العرض وإضافته للشيت بنجاح!';
        form.reset();
        imagePreview.style.display = 'none';
      } else {
        throw new Error(result.message || 'حدث خطأ أثناء الحفظ');
      }
    } catch (err) {
      statusDiv.style.color = '#ff4d4d';
      statusDiv.textContent = '❌ خطأ: ' + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
