<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة المتجر - النحاس</title>
  <style>
    :root {
      --primary: #c9933f;
      --bg: #121212;
      --card: #1e1e1e;
      --text: #eee;
      --border: #333;
      --danger: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }

    #lockScreen {
      position: fixed; inset: 0; background: #121212; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; width: 100%; max-width: 360px; text-align: center;
    }
    .lock-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .pin-input {
      width: 100%; padding: 14px; text-align: center; font-size: 1.4rem; letter-spacing: 6px;
      background: #2a2a2a; border: 1px solid var(--border); border-radius: 8px; color: #fff;
      outline: none; margin: 15px 0;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .btn-logout {
      background: transparent; border: 1px solid var(--danger); color: var(--danger);
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border);
      color: #aaa; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    .sub-mode { display: flex; gap: 10px; margin-bottom: 15px; background: #2a2a2a; padding: 4px; border-radius: 8px; }
    .sub-mode button { flex: 1; padding: 8px; border: none; background: transparent; color: #bbb; border-radius: 6px; cursor: pointer; }
    .sub-mode button.active { background: #3a3a3a; color: #fff; font-weight: bold; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none;
    }
    .upload-box {
      border: 1px dashed var(--primary); padding: 10px; text-align: center;
      border-radius: 6px; cursor: pointer; color: var(--primary); font-size: 0.9rem;
    }
    .img-preview { width: 100%; max-height: 140px; object-fit: cover; border-radius: 6px; margin-top: 8px; display: none; }

    .submit-btn {
      width: 100%; padding: 12px; background: var(--primary); color: #000; border: none;
      border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
    }
    .submit-btn:disabled { opacity: 0.5; }
    .status { text-align: center; margin-top: 10px; font-size: 0.85rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- شاشة القفل -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h3 style="color: var(--primary); margin-bottom: 8px;">لوحة إدارة المتجر</h3>
    <p style="font-size: 0.85rem; color: #888;">أدخل رمز PIN للمتابعة</p>
    <form id="pinForm" onsubmit="handleLogin(event)">
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" inputmode="numeric" required autofocus>
      <button type="submit" id="loginBtn" class="submit-btn">تسجيل الدخول</button>
    </form>
    <div id="pinError" style="color: var(--danger); font-size: 0.85rem; margin-top: 8px;"></div>
  </div>
</div>

<!-- محتوى لوحة التحكم -->
<div class="container" id="adminContent">
  <div class="header-bar">
    <h3 style="color: var(--primary);">⚙️ لوحة الإدارة</h3>
    <button class="btn-logout" onclick="logout()">تسجيل الخروج 🚪</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchMainTab('products')">📦 المنتجات</button>
    <button class="tab-btn" onclick="switchMainTab('offers')">🔥 عروض السلايدر</button>
  </div>

  <!-- 1. قسم إدارة المنتجات -->
  <div id="productsSection" class="card">
    <div class="sub-mode">
      <button id="modeAdd" class="active" onclick="setProductMode('add')">➕ إضافة جديد</button>
      <button id="modeEdit" onclick="setProductMode('edit')">✏️ تعديل منتج</button>
    </div>

    <form id="productForm">
      <div id="selectProductGroup" class="form-group hidden">
        <label>اختر المنتج للتعديل:</label>
        <select id="productSelect" onchange="onProductSelectChange()">
          <option value="">-- اختر صنفاً --</option>
        </select>
      </div>

      <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" id="pName" required placeholder="مثال: كاجو محمص فاخر">
      </div>

      <div class="form-group">
        <label>القسم الرئيسي</label>
        <select id="pCategory" onchange="updateSubCategories()" required>
          <option value="القهوة والمشروبات الساخنة">القهوة والمشروبات الساخنة</option>
          <option value="الموالح والمكسرات">الموالح والمكسرات</option>
          <option value="الحلويات والسكاكر">الحلويات والسكاكر</option>
          <option value="العسل والتمور">العسل والتمور</option>
          <option value="البسكويت والكيك والشوكولا">البسكويت والكيك والشوكولا</option>
          <option value="الشيبس والسناكس">الشيبس والسناكس</option>
        </select>
      </div>

      <div class="form-group">
        <label>القسم الفرعي</label>
        <select id="pSubcat"></select>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>السعر</label>
          <input type="number" id="pPrice" required placeholder="190000">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>طريقة التسعير</label>
          <select id="pPriceText">
            <option value="بالوزن">بالوزن</option>
            <option value="بالقطعة">بالقطعة</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>حالة التوفر</label>
        <select id="pAvailable">
          <option value="متوفر">متوفر</option>
          <option value="غير متوفر">غير متوفر</option>
        </select>
      </div>

      <div class="form-group">
        <label>ملاحظات إضافية (Placeholder)</label>
        <input type="text" id="pPlaceholder" placeholder="مثلاً: خفيف ملح، محمص...">
      </div>

      <div class="form-group">
        <label>صورة المنتج</label>
        <label for="pImgFile" class="upload-box">📷 اختيار صورة من الجوال</label>
        <input type="file" id="pImgFile" accept="image/*" style="display:none;" onchange="previewImg(this, 'pPreview')">
        <img id="pPreview" class="img-preview">
      </div>

      <button type="submit" id="pSubmitBtn" class="submit-btn">حفظ المنتج</button>
      <div id="pStatus" class="status"></div>
    </form>
  </div>

  <!-- 2. قسم إدارة العروض -->
  <div id="offersSection" class="card hidden">
    <form id="offerForm">
      <div class="form-group">
        <label>عنوان العرض</label>
        <input type="text" id="oTitle" required placeholder="مثال: خصم 20% على القهوة">
      </div>
      <div class="form-group">
        <label>وصف العرض</label>
        <textarea id="oDesc" rows="2" placeholder="تفاصيل العرض..."></textarea>
      </div>
      <div class="form-group">
        <label>حالة العرض</label>
        <select id="oAvailable">
          <option value="متوفر">متوفر بالسلايدر</option>
          <option value="غير متوفر">مخفي</option>
        </select>
      </div>
      <div class="form-group">
        <label>صورة السلايدر</label>
        <label for="oImgFile" class="upload-box">📷 اختيار صورة العرض</label>
        <input type="file" id="oImgFile" accept="image/*" style="display:none;" onchange="previewImg(this, 'oPreview')">
        <img id="oPreview" class="img-preview">
      </div>
      <button type="submit" id="oSubmitBtn" class="submit-btn">نشر العرض بالسلايدر</button>
      <div id="oStatus" class="status"></div>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEWgcYs1dV3hKP9Qivx3gOOJlCgUBEKibqeNUfQ7c-z0XOwxrgwfqhOt_isoe4K_Wv/exec";
  const CLOUD_NAME = "dvzg70krq";
  const UPLOAD_PRESET = "alnahhas";

  let currentPin = sessionStorage.getItem('auth_pin') || '';

  // التحقق التلقائي عند فتح الصفحة
  if (currentPin) {
    verifyAndUnlock(currentPin, false);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const pin = document.getElementById('pinInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('pinError');
    
    btn.disabled = true;
    err.textContent = 'جاري التحقق من السيرفر... ⏳';

    const success = await verifyAndUnlock(pin, true);
    btn.disabled = false;
    if (!success) {
      err.textContent = 'رمز PIN غير صحيح ❌';
      document.getElementById('pinInput').value = '';
    }
  }

  async function verifyAndUnlock(pin, isManual) {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=verifyPin&pin=${encodeURIComponent(pin)}`);
      const data = await res.json();
      if (data.status === 'success') {
        currentPin = pin;
        sessionStorage.setItem('auth_pin', pin);
        document.getElementById('lockScreen').classList.add('hidden');
        return true;
      }
    } catch (e) {}
    if (!isManual) sessionStorage.removeItem('auth_pin');
    return false;
  }

  function logout() {
    sessionStorage.removeItem('auth_pin');
    location.reload();
  }

  const subCatsMap = {
    "القهوة والمشروبات الساخنة": ["قهوة مطحونة", "هيل", "بن معبأ", "مشروبات ساخنة وبودرة"],
    "الموالح والمكسرات": ["خلطات خاصة ومكسرات", "كراكرز وموالح", "بزورات", "مكسرات نية وطبخ"],
    "الحلويات والسكاكر": ["شوكولا وضيافة", "توفي ومصاص", "ملبس ومسليات"],
    "العسل والتمور": ["عسل", "تمور", "فواكه مجففة وزبيب"],
    "البسكويت والكيك والشوكولا": ["بالحبة", "بالعلبة", "بسكويت فرط", "شوكولا الدهن"],
    "الشيبس والسناكس": ["شيبس", "شيبس فرط"]
  };

  let allProducts = [];
  let currentProductMode = 'add';

  function updateSubCategories() {
    const cat = document.getElementById('pCategory').value;
    const subSelect = document.getElementById('pSubcat');
    subSelect.innerHTML = '';
    (subCatsMap[cat] || []).forEach(sub => {
      const opt = document.createElement('option');
      opt.value = sub; opt.textContent = sub;
      subSelect.appendChild(opt);
    });
  }
  updateSubCategories();

  function switchMainTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tab === 'products' ? i===0 : i===1)));
    document.getElementById('productsSection').classList.toggle('hidden', tab !== 'products');
    document.getElementById('offersSection').classList.toggle('hidden', tab !== 'offers');
  }

  function setProductMode(mode) {
    currentProductMode = mode;
    document.getElementById('modeAdd').classList.toggle('active', mode === 'add');
    document.getElementById('modeEdit').classList.toggle('active', mode === 'edit');
    document.getElementById('selectProductGroup').classList.toggle('hidden', mode === 'add');
    document.getElementById('productForm').reset();
    document.getElementById('pPreview').style.display = 'none';
    updateSubCategories();

    if (mode === 'edit' && allProducts.length === 0) {
      loadProductsList();
    }
  }

  async function loadProductsList() {
    const select = document.getElementById('productSelect');
    select.innerHTML = '<option>جاري جلب المنتجات...</option>';
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getProducts&pin=${encodeURIComponent(currentPin)}`);
      const data = await res.json();
      allProducts = data.data || [];
      select.innerHTML = '<option value="">-- اختر صنفاً للتعديل --</option>';
      allProducts.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.name} (${p.price})`;
        select.appendChild(opt);
      });
    } catch (e) {
      select.innerHTML = '<option>تعذر جلب المنتجات</option>';
    }
  }

  function onProductSelectChange() {
    const id = document.getElementById('productSelect').value;
    const p = allProducts.find(item => item.id == id);
    if (!p) return;

    document.getElementById('pName').value = p.name || '';
    document.getElementById('pCategory').value = p.category || 'القهوة والمشروبات الساخنة';
    updateSubCategories();
    document.getElementById('pSubcat').value = p.subcat || '';
    document.getElementById('pPrice').value = p.price || 0;
    document.getElementById('pPriceText').value = p.customPriceText || 'بالوزن';
    document.getElementById('pAvailable').value = p.available || 'متوفر';
    document.getElementById('pPlaceholder').value = p.placeholder || '';
    
    if (p.img) {
      const prev = document.getElementById('pPreview');
      prev.src = p.img;
      prev.style.display = 'block';
    }
  }

  function previewImg(input, previewId) {
    if (input.files && input.files[0]) {
      const img = document.getElementById(previewId);
      img.src = URL.createObjectURL(input.files[0]);
      img.style.display = 'block';
    }
  }

  async function uploadToCloudinary(file) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    return data.secure_url;
  }

  // حفظ المنتج مع إرسال الـ PIN المشفر للسيرفر
  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pSubmitBtn');
    const status = document.getElementById('pStatus');
    btn.disabled = true;
    status.style.color = '#c9933f';
    status.textContent = 'جاري الحفظ... ⏳';

    try {
      let imgUrl = '';
      const file = document.getElementById('pImgFile').files[0];
      if (file) imgUrl = await uploadToCloudinary(file);

      const payload = {
        pin: currentPin,
        action: currentProductMode === 'add' ? 'addProduct' : 'updateProduct',
        id: currentProductMode === 'edit' ? document.getElementById('productSelect').value : undefined,
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        subcat: document.getElementById('pSubcat').value,
        price: document.getElementById('pPrice').value,
        customPriceText: document.getElementById('pPriceText').value,
        available: document.getElementById('pAvailable').value,
        placeholder: document.getElementById('pPlaceholder').value,
        img: imgUrl
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        status.style.color = '#4CAF50';
        status.textContent = '✅ ' + data.message;
        if (currentProductMode === 'add') {
          document.getElementById('productForm').reset();
          document.getElementById('pPreview').style.display = 'none';
        } else {
          allProducts = [];
          loadProductsList();
        }
      } else {
        throw new Error(data.message);
      }
    } catch (err) {
      status.style.color = '#ff4d4d';
      status.textContent = '❌ خطأ: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  // حفظ العرض بالسلايدر
  document.getElementById('offerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('oSubmitBtn');
    const status = document.getElementById('oStatus');
    btn.disabled = true;
    status.style.color = '#c9933f';
    status.textContent = 'جاري النشر... ⏳';

    try {
      let imgUrl = '';
      const file = document.getElementById('oImgFile').files[0];
      if (file) imgUrl = await uploadToCloudinary(file);

      const payload = {
        pin: currentPin,
        action: 'addOffer',
        title: document.getElementById('oTitle').value,
        description: document.getElementById('oDesc').value,
        available: document.getElementById('oAvailable').value,
        img: imgUrl
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        status.style.color = '#4CAF50';
        status.textContent = '✅ تم نشر العرض بنجاح!';
        document.getElementById('offerForm').reset();
        document.getElementById('oPreview').style.display = 'none';
      } else {
        throw new Error(data.message);
      }
    } catch (err) {
      status.style.color = '#ff4d4d';
      status.textContent = '❌ خطأ: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
