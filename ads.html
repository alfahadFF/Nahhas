<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>محمصة النحاس | إعلانات الشركاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --espresso: #2B1810;
    --espresso-deep: #1A0D08;
    --copper: #B8703D;
    --gold: #C9A227;
    --cream: #FAF3E7;
    --card-bg: #FFFDF9;
    --ink: #2A211C;
    --ink-muted: #7A6A5C;
    --line: rgba(184,112,61,0.2);
    --green: #25D366;
    --green-dark: #1da851;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #190F0C;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  .app-shell {
    width: 100%;
    max-width: 480px;
    background: var(--cream);
    min-height: 100vh;
    box-shadow: 0 0 35px rgba(0,0,0,0.6);
    padding-bottom: 40px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--espresso-deep);
    border-bottom: 1px solid rgba(201,162,39,0.3);
  }
  .btn-back {
    font-family: 'Cairo', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(250,243,231,0.1);
    padding: 6px 14px;
    border-radius: 20px;
  }
  .page-header {
    padding: 20px 18px 10px;
    text-align: center;
  }
  .page-header h1 { font-family: 'Aref Ruqaa', serif; font-size: 1.8rem; color: var(--espresso); }
  .page-header p { font-size: 0.85rem; color: var(--ink-muted); margin-top: 4px; }

  .ads-list {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ad-card {
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(43,24,16,0.06);
  }
  .ad-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .ad-content { padding: 14px 16px; }
  .ad-badge {
    display: inline-block;
    background: var(--copper);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .ad-title { font-family: 'Cairo', sans-serif; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
  .ad-desc { font-size: 0.85rem; color: var(--ink-muted); margin: 6px 0 12px; line-height: 1.5; }
  .btn-ad-contact {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--espresso);
    color: var(--gold);
    font-family: 'Cairo', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 12px;
  }

  /* Booking Request Card */
  .book-card {
    margin: 16px;
    background: linear-gradient(145deg, var(--espresso-deep) 0%, #3a1e12 100%);
    border-radius: 22px;
    padding: 20px 18px;
    color: #fff;
    border: 1px solid rgba(201,162,39,0.4);
  }
  .book-card h3 { font-family: 'Aref Ruqaa', serif; color: var(--gold); font-size: 1.5rem; margin-bottom: 6px; }
  .book-card p { font-size: 0.82rem; color: #e3d5c4; margin-bottom: 14px; line-height: 1.5; }
  .form-field { margin-bottom: 12px; }
  .form-field label {
    display: block;
    font-family: 'Cairo', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .form-field input, .form-field textarea {
    width: 100%;
    background: rgba(250,243,231,0.08);
    border: 1px solid rgba(201,162,39,0.4);
    border-radius: 12px;
    padding: 10px 12px;
    color: #fff;
    font-size: 0.88rem;
    outline: none;
    font-family: 'Tajawal', sans-serif;
  }
  .btn-wa-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 14px;
    border: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <a href="menu.html" class="btn-back">➔ عودة للمنيو</a>
    <div style="font-family:'Aref Ruqaa'; color:var(--gold); font-size:1.1rem;">محمصة النحاس</div>
  </div>

  <div class="page-header">
    <h1>دليل الشركاء والمساحات الإعلانية</h1>
    <p>عروض وخدمات محلية مميزة لزبائن محمصة النحاس</p>
  </div>

  <div class="ads-list" id="adsContainer"></div>

  <div class="book-card">
    <h3>احجز مساحتك الإعلانية معنا</h3>
    <p>اعرض متجرك أو خدماتك أمام المئات من زبائن المحمصة يومياً.</p>
    <div class="form-field">
      <label>اسم المحل / المتجر</label>
      <input type="text" id="reqName" placeholder="اسم متجرك">
    </div>
    <div class="form-field">
      <label>رقم الهاتف أو الواتساب</label>
      <input type="tel" id="reqPhone" placeholder="09xxxxxxxx" dir="ltr">
    </div>
    <div class="form-field">
      <label>تفاصيل العرض أو الخدمة</label>
      <textarea id="reqDetails" placeholder="اكتب نص الإعلان والعرض الذي ترغب بنشره..."></textarea>
    </div>
    <button type="button" class="btn-wa-submit" onclick="submitAdBooking()">
      📩 إرسال طلب حجز المساحة عبر واتساب
    </button>
  </div>
</div>

<script>
const ROASTERY_WA = "963991457935";
const DEFAULT_ADS = [
  {
    id: "ad-1",
    sponsorName: "مجوهرات الزمرد",
    title: "أحدث تصاميم الذهب والمجوهرات",
    desc: "خصومات حصرية 15% لزبائن محمصة النحاس على مصاغ الذهب والمجوهرات الراقية.",
    phone: "00963991457935",
    img: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=600&q=80"
  },
  {
    id: "ad-2",
    sponsorName: "صالون رويال بيوتي",
    title: "عناية متكاملة وإطلالة ساحرة",
    desc: "خدمات تصفيف شعر، ميك اب وعناية بالبشرة بأحدث التقنيات العالمية.",
    phone: "00963991457935",
    img: "https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600&q=80"
  }
];

const adsData = JSON.parse(localStorage.getItem('al_nahas_ads')) || DEFAULT_ADS;

window.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('adsContainer');
  container.innerHTML = '';
  adsData.forEach(ad => {
    const card = document.createElement('div');
    card.className = 'ad-card';
    card.innerHTML = `
      <img src="${ad.img}" alt="${ad.title}">
      <div class="ad-content">
        <span class="ad-badge">إعلان مدفوع • ${ad.sponsorName}</span>
        <h3 class="ad-title">${ad.title}</h3>
        <p class="ad-desc">${ad.desc}</p>
        <a class="btn-ad-contact" href="https://wa.me/${ad.phone.replace(/[^0-9]/g, '')}" target="_blank">
          💬 تواصل مع المعلن مباشرة
        </a>
      </div>
    `;
    container.appendChild(card);
  });
});

function submitAdBooking() {
  const name = document.getElementById('reqName').value.trim();
  const phone = document.getElementById('reqPhone').value.trim();
  const details = document.getElementById('reqDetails').value.trim();

  if (!name || !phone) {
    alert('يرجى كتابة اسم المتجر ورقم الهاتف.');
    return;
  }

  const text = `📣 *طلب حجز مساحة إعلانية - محمصة النحاس*\n\n` +
               `🏪 *اسم المعلن:* ${name}\n` +
               `📞 *رقم الهاتف:* ${phone}\n` +
               `📝 *تفاصيل الإعلان:* ${details}\n\n` +
               `يرجى التزويد بأسعار الباقات الإعلانية المتاحة.`;

  window.open(`https://wa.me/${ROASTERY_WA}?text=${encodeURIComponent(text)}`, '_blank');
}
</script>

</body>
</html>
